<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sigma Tactix — Header Harness (dev only)</title>
    <script>
      // Mirror the theme bootstrap from index.html so AppearanceProvider's
      // initial state matches what the real app shows.
      try {
        const t = localStorage.getItem('sigmatactix_appearance') || 'light'
        document.documentElement.dataset.theme = t
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/previewHarness.tsx"></script>
  </body>
</html>
